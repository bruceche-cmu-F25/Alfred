<!doctype html>
<!--
  Alfred: everyday vs development conversations. Layout prototype with sample data only; no build step.
  Design: docs/design/dev-mode.md.
  Three scenes (switcher at the top, or ?scene=new|session|daily):
    新会话: pick a project, worktree, permission mode, then write the first message.
    开发会话: a full-page session with usage on top, a bar under the composer, and a right panel (environment, context, changes).
             Approve the edit and the command to walk through one turn.
    日常: the same conversation component in the Alfred panel; asking it to change code offers a development session.
  Under 760px wide it is the phone layout. ?bare hides the switcher.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alfred 开发会话</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="stylesheet" href="tokens.css">
<style>
:root {
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.23, 1, .32, 1);
  --add: var(--ok);
  --del: oklch(.6 .17 25);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--alf); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: .88em; }
.muted { color: var(--muted); }

/* Prototype switcher */
/* Prototype only: scenes and light/dark, at the bottom of the sidebar. */
.proto { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin: 8px 0 4px; padding: 6px; border-radius: 10px; box-shadow: inset 0 0 0 1px dashed var(--line); outline: 1px dashed var(--line); outline-offset: -1px; font-size: 11.5px; }
.proto b { width: 100%; padding: 0 4px 2px; color: var(--muted); font-weight: 500; }
.proto i { width: 100%; height: 0; }
.proto button { height: 24px; padding: 0 8px; border-radius: 7px; color: var(--copy); white-space: nowrap; }
.proto button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
html[data-bare] .proto { display: none; }

/* ── Shell: sidebar | main ─────────────────────────────────── */
.app { height: 100dvh; display: grid; grid-template-columns: 220px minmax(0, 1fr); }
.side { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; padding: 10px 8px 12px; background: var(--paper); border-right: 1px solid var(--line-soft); }
.side-top { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 12px 6px; }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.find { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 9px; margin-bottom: 6px; border-radius: 8px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); color: var(--muted); font-size: 13px; white-space: nowrap; }
.find kbd { margin-left: auto; font: 11px var(--mono); }
.nav-label { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px 4px 9px; color: var(--muted); font-size: 12px; }
.nav-label .icon-btn { width: 22px; height: 22px; }
.nav-label .icon-btn svg { width: 14px; height: 14px; }
.nav-item { position: relative; width: 100%; height: 30px; display: flex; align-items: center; gap: 9px; padding: 0 9px; border-radius: 8px; color: var(--copy); font-size: 13.5px; text-align: left; white-space: nowrap; text-decoration: none; }
.nav-item:hover { background: var(--wash); }
.nav-item[aria-current="page"] { background: var(--wash); color: var(--ink); font-weight: 500; }
.nav-item svg { color: var(--k-solid, currentColor); }
.nav-item .count { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
.proj { font-weight: 500; color: var(--ink); }
.proj .chev { width: 14px; height: 14px; color: var(--muted); transition: transform 150ms; }
.proj[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.sess { width: 100%; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 9px 0 22px; border-radius: 8px; color: var(--copy); font-size: 13px; text-align: left; }
.sess:hover { background: var(--wash); }
.sess[aria-current="true"] { background: var(--wash); color: var(--ink); }
.sess .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.sess .time { flex: none; color: var(--muted); font: 11px var(--mono); }
.st { flex: none; width: 10px; display: grid; place-items: center; }
.dotm { width: 7px; height: 7px; border-radius: 50%; background: var(--k-solid); }
.dotm.idle { background: none; box-shadow: inset 0 0 0 1.5px var(--line); }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--alf); animation: breathe 1.6s ease-in-out infinite; }
.add-folder { color: var(--muted); }
.nav-spacer { flex: 1; min-height: 12px; }
.icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.icon-btn:hover { background: var(--wash); color: var(--ink); }
.icon-btn[aria-pressed="true"] { color: var(--ink); background: var(--wash); }

.main { min-width: 0; min-height: 0; display: flex; }

/* ── Buttons, chips, cards ─────────────────────────────────── */
.btn { min-height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn.ghost { background: none; color: var(--copy); box-shadow: inset 0 0 0 1px var(--line); font-weight: 400; }
.btn.ghost:hover { color: var(--ink); }
.btn.alf { background: var(--alf); color: #fff; }
.btn.small { min-height: 28px; padding: 0 11px; font-size: 12px; }
.link { color: var(--alf); font-size: 12px; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--alf) 35%, transparent); text-underline-offset: 3px; }
.switch { position: relative; flex: none; width: 38px; height: 22px; border-radius: 11px; background: var(--line); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px #0003; transition: transform 200ms var(--ease); }
.switch[aria-checked="true"] { background: var(--ok); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }
.add-n { color: var(--add); }
.del-n { color: var(--del); }

/* Usage: tokens in and out, cost, how full the context is (after pi web). */
.usage { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font: 12px var(--mono); white-space: nowrap; }
.ring { display: inline-flex; align-items: center; gap: 4px; }
.ring svg { width: 14px; height: 14px; stroke-width: 2; }
.ring circle:first-child { stroke: var(--line); }
.ring circle:last-child { stroke: var(--alf); }

/* ── Conversation component (shared by daily and dev) ────────── */
.thread { flex: 1; min-height: 0; overflow-y: auto; }
.thread-in { display: flex; flex-direction: column; gap: 18px; padding: 24px 0 24px; }
.msg.me { align-self: flex-end; max-width: 86%; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.msg.me .bubble { padding: 8px 13px; border-radius: 16px 16px 4px 16px; background: var(--wash); color: var(--ink); white-space: pre-wrap; }
.from-page { color: var(--muted); font-size: 11px; }
.msg.al { display: flex; flex-direction: column; gap: 8px; color: var(--ink); }
.msg.al p { color: var(--ink); }
.group { color: var(--muted); font-size: 13.5px; }
.group summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 4px; }
.group summary::-webkit-details-marker { display: none; }
.group summary svg { width: 14px; height: 14px; transition: transform 150ms; }
.group[open] summary svg { transform: rotate(90deg); }
.group ul { margin: 6px 0 0 2px; padding-left: 12px; border-left: 1px solid var(--line-soft); font-size: 12.5px; }
.group li { padding: 1px 0; font-family: var(--mono); }
.stepline { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; }
.stepline .ok { color: var(--ok); }
.stepline code { color: var(--copy); }
.stepline .end { margin-left: auto; font: 12px var(--mono); }
.working { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; }
.working .fig { width: 22px; height: 22px; }
.receipts { display: flex; flex-direction: column; gap: 3px; padding: 8px 12px; border-radius: 10px; background: var(--alf-soft); color: var(--copy); font-size: 13px; }
.receipts li::before { content: "✓  "; color: var(--alf); }
.run-meta { display: flex; flex-wrap: wrap; gap: 10px; color: var(--muted); font: 11.5px var(--mono); }

/* A card that waits for you: the action, exactly what it will do, and the buttons on the card. */
.ask { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--raise); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--warm) 55%, var(--line)); }
.ask-h { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.ask-h b { color: var(--ink); font-weight: 600; font-size: 14px; }
.ask-h .tag { margin-left: auto; }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 6px; background: var(--k-fill); color: var(--k-text); font-size: 12px; font-weight: 500; white-space: nowrap; }
.cmd { padding: 9px 12px; border-radius: 10px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-soft); font: 13px/1.5 var(--mono); color: var(--ink); white-space: pre-wrap; word-break: break-all; }
.cmd::before { content: "$ "; color: var(--muted); }
.diff { overflow-x: auto; padding: 8px 0; border-radius: 10px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-soft); font: 12px/1.55 var(--mono); }
.diff div { padding: 0 12px; white-space: pre; }
.diff .a { background: color-mix(in oklch, var(--add) 14%, transparent); }
.diff .d { background: color-mix(in oklch, var(--del) 14%, transparent); }
.diff .h { color: var(--muted); }
.ask-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ask-note { color: var(--muted); font-size: 12px; }

.handoff { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--alf-soft); }
.handoff blockquote { margin: 0; padding: 8px 12px; border-left: 2px solid var(--alf); color: var(--copy); font-size: 13.5px; }

/* Composer with its bar: model, thinking, (dev) permission mode. */
.composer { flex: none; position: relative; display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: 16px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); }
.composer:focus-within { box-shadow: inset 0 0 0 1.5px var(--ink); }
.composer textarea { width: 100%; min-height: 46px; max-height: 30vh; padding: 4px 6px; resize: none; border: 0; background: none; outline: none; line-height: 1.5; }
.composer textarea::placeholder { color: var(--muted); }
.bar { position: relative; display: flex; align-items: center; gap: 2px; }
.bar .grow { flex: 1; }
.pick { height: 28px; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 8px; color: var(--copy); font-size: 12.5px; white-space: nowrap; }
.pick:hover, .pick[aria-expanded="true"] { background: var(--wash); color: var(--ink); }
.pick svg { width: 14px; height: 14px; }
.pick .chev { width: 12px; height: 12px; color: var(--muted); }
.pick.mode { color: var(--k-text); }
.pick.mode svg:first-child { color: var(--k-solid); }
.send { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--bg); }
.send svg { width: 16px; height: 16px; }
.menu { position: absolute; bottom: calc(100% + 6px); z-index: 30; min-width: 220px; padding: 6px; border-radius: 12px; background: var(--raise); box-shadow: var(--shadow), inset 0 0 0 1px var(--line-soft); }
.menu button { width: 100%; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 0 8px; padding: 7px 10px; border-radius: 8px; text-align: left; color: var(--copy); font-size: 13px; }
.menu button:hover { background: var(--wash); color: var(--ink); }
.menu button .ck { grid-row: span 2; color: var(--alf); }
.menu button small { grid-column: 2; color: var(--muted); font-size: 12px; line-height: 1.45; }
.menu .menu-label { padding: 6px 10px 2px; color: var(--muted); font-size: 11.5px; }

/* ── Dev session page ──────────────────────────────────────── */
.session { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { flex: none; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 22px; border-bottom: 1px solid var(--line-soft); }
.topbar h1 { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 15px; font-weight: 600; }
.where { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 7px; background: var(--wash); color: var(--copy); font: 12px var(--mono); white-space: nowrap; }
.where svg { width: 13px; height: 13px; color: var(--muted); }
.topbar .usage { margin-left: auto; }
.col { width: min(760px, calc(100% - 48px)); margin: 0 auto; }
.session .composer { margin: 0 auto 16px; }
.phone-only { display: none !important; }

/* Right panel: environment, context, changes, processes (after Claude Code). */
.panel { width: 300px; flex: none; min-height: 0; overflow-y: auto; padding: 14px 16px 40px; border-left: 1px solid var(--line-soft); background: var(--paper); font-size: 13.5px; }
.panel[hidden] { display: none; }
.sec { padding: 12px 0 14px; border-bottom: 1px solid var(--line-soft); }
.sec:last-child { border-bottom: 0; }
.sec h3 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; color: var(--ink); font-size: 13px; font-weight: 600; }
.sec h3 span { color: var(--muted); font: 400 12px var(--mono); }
.kv { display: flex; align-items: center; gap: 9px; padding: 4px 0; color: var(--copy); }
.kv svg { width: 15px; height: 15px; color: var(--muted); }
.kv .mono { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.kv .end { margin-left: auto; color: var(--muted); font-size: 12px; }
.meter { height: 5px; margin: 6px 0 4px; border-radius: 3px; background: var(--wash); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--alf); }
.small-note { color: var(--muted); font-size: 12px; line-height: 1.5; }
.file { width: 100%; display: flex; align-items: center; gap: 8px; padding: 4px 6px; margin: 0 -6px; border-radius: 7px; text-align: left; font: 12px var(--mono); color: var(--copy); }
.file:hover { background: var(--wash); }
.file .p { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; direction: rtl; text-align: left; }
.file .new { color: var(--alf); font-family: var(--sans); font-size: 11px; }
.sec .actions { display: flex; gap: 6px; margin-top: 10px; }
.empty-line { color: var(--muted); font-size: 12.5px; }

/* Diff drawer, over the thread */
.drawer { position: absolute; inset: 52px 0 0 0; z-index: 20; display: flex; flex-direction: column; background: var(--bg); }
.drawer-h { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 22px; border-bottom: 1px solid var(--line-soft); font: 13px var(--mono); }
.drawer-h .grow { flex: 1; }
.drawer .diff { flex: 1; margin: 16px 22px 22px; overflow: auto; }

/* ── New session page ──────────────────────────────────────── */
.newpage { flex: 1; min-width: 0; overflow-y: auto; display: flex; align-items: flex-start; justify-content: center; padding: 64px 24px 48px; }
.new-in { width: min(620px, 100%); display: flex; flex-direction: column; gap: 14px; }
.new-head { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 8px; text-align: center; }
.new-head .fig { width: 64px; height: 64px; }
.new-head h2 { font-size: 22px; font-weight: 650; }
.new-head p { color: var(--muted); font-size: 14px; }
.box { border-radius: 14px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); overflow: hidden; }
.box-label { padding: 10px 14px 4px; color: var(--muted); font-size: 12px; }
.prow { width: 100%; display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 9px 14px; text-align: left; color: var(--copy); }
.prow:hover { background: var(--wash); }
.prow svg { width: 16px; height: 16px; color: var(--muted); }
.prow .n { color: var(--ink); font-weight: 500; }
.prow .path { grid-column: 2; color: var(--muted); font: 11.5px var(--mono); }
.prow .ck { grid-row: span 2; color: var(--alf); }
.prow .meta { grid-row: span 2; color: var(--muted); font-size: 12px; }
.prow + .prow { border-top: 1px solid var(--line-soft); }
.opt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 14px; align-items: center; padding: 12px 14px; }
.opt + .opt { border-top: 1px solid var(--line-soft); }
.opt .n { color: var(--ink); font-weight: 500; font-size: 14px; }
.opt .d { grid-column: 1; color: var(--muted); font-size: 12.5px; }
.opt .end { grid-column: 2; grid-row: 1 / 3; }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--wash); }
.seg button { height: 26px; padding: 0 10px; border-radius: 7px; color: var(--copy); font-size: 12.5px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--ink); box-shadow: 0 1px 2px #0002; font-weight: 500; }
.trust { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 14px; background: color-mix(in oklch, var(--warm) 14%, var(--raise)); font-size: 14px; color: var(--copy); }
.trust b { color: var(--ink); }
.trust ul { padding-left: 2px; font-size: 13px; }
.trust li::before { content: "·  "; color: var(--muted); }
.resume { display: flex; flex-direction: column; }
.resume button { display: flex; align-items: baseline; gap: 10px; padding: 9px 14px; text-align: left; color: var(--copy); font-size: 13.5px; }
.resume button:hover { background: var(--wash); }
.resume button + button { border-top: 1px solid var(--line-soft); }
.resume .k { flex: none; font-weight: 500; }
.resume .k.wait { color: var(--warm); }
.resume .s { color: var(--muted); font-size: 12.5px; margin-left: auto; }

/* ── Daily: a page plus the Alfred panel with the same component ─ */
.daily-page { flex: 1; min-width: 0; overflow-y: auto; padding: 40px 40px 80px; }
.daily-page h1 { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 650; }
.daily-page h1 svg { width: 28px; height: 28px; color: var(--k-solid); stroke-width: 1.9; }
.daily-page .sub { margin: 6px 0 22px; color: var(--muted); font-size: 14px; }
.todo { display: flex; align-items: center; gap: 14px; min-height: 46px; padding: 6px 12px; border-radius: 10px; max-width: 700px; }
.todo:hover { background: var(--wash); }
.check { flex: none; width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--k-solid, var(--line)); }
.todo .meta { margin-left: auto; color: var(--muted); font-size: 12px; }
.alfred { width: 400px; flex: none; min-height: 0; display: flex; flex-direction: column; background: var(--raise); border-left: 1px solid var(--line-soft); }
.alf-head { flex: none; display: flex; align-items: flex-start; gap: 12px; padding: 18px 16px 14px 20px; }
.alf-head .fig { width: 36px; height: 36px; }
.alf-name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.ctxchip { padding: 1px 8px; border-radius: 999px; background: var(--wash); color: var(--muted); font-size: 12px; font-weight: 400; }
.alf-line { margin-top: 4px; color: var(--copy); font-size: 14px; line-height: 1.5; }
.conv-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 20px; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.conv-head .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--copy); font-weight: 500; }
.alfred .thread-in { padding: 18px 20px; }
.alfred .composer { margin: 0 14px 14px; background: var(--bg); }

/* Phone */
.sheet-bg { display: none; }
.panel-usage { display: none !important; }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 30% 0 0; z-index: 40; transform: translateX(-102%); transition: transform 250ms var(--ease); padding-top: calc(10px + env(safe-area-inset-top)); }
  body[data-sheet="nav"] .side { transform: none; }
  .sheet-bg { position: fixed; inset: 0; z-index: 35; background: #00000040; }
  body[data-sheet] .sheet-bg { display: block; }
  .phone-only { display: grid !important; }
  .topbar { padding: 0 8px; padding-top: env(safe-area-inset-top); height: calc(52px + env(safe-area-inset-top)); }
  .topbar .usage { display: none; }
  .topbar .where { display: none; }
  .col { width: calc(100% - 28px); }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; width: auto; max-height: 78dvh; border: 0; border-radius: 18px 18px 0 0; box-shadow: var(--shadow); transform: translateY(102%); transition: transform 250ms var(--ease); }
  .panel[hidden] { display: block; }
  body[data-sheet="panel"] .panel { transform: none; }
  .panel-usage { display: flex !important; }

/* The walk-through's progress: 0 edit waits · 1 thinking · 2 command waits · 3 command running · 4 done. */
function walkState() {

      <div class="ask-actions"><button class="btn" data-act="allow-edit">允许</button><button class="btn ghost" data-act="deny">不改</button><button class="btn ghost small" data-act="file" data-id="packages/ui/src/shell/ComposerBar.tsx">看新文件</button>
      <span class="grow"></span></div>
      <p class="ask-note">现在是「改文件前问」。<button class="link" data-act="set-mode" data-id="edits" data-for="session">这个项目里改文件以后不用问</button></p></div>`);
  }
  if (S.denied) out.push(`<div class="stepline">— 你没让它改</div><div class="msg al"><p>好，没改。要不要我先只写个计划，你看过再动？</p></div>`);
  if (S.step >= 1 && !S.denied) {
    out.push(`<div class="stepline"><span class="ok">✓</span>改了 <code>Conversation.tsx</code><span class="end"><span class="add-n">+18</span> <span class="del-n">−9</span></span></div>
      <div class="stepline"><span class="ok">✓</span>新建 <code>shell/ComposerBar.tsx</code><span class="end"><span class="add-n">+22</span></span></div>`);
  }
  if (S.step === 1) out.push(`<div class="working">${figSlot("turn")}在想下一步…</div>`);
  if (S.step === 2) {
    out.push(`<div class="msg al"><p>改完了，跑一下类型检查。</p></div>
      <div class="ask" role="group" aria-label="等你批准">
      <div class="ask-h">${ic("term")}<b>跑命令</b><span>在 <span class="mono">~/Alfred</span></span><span class="tag" data-k="warm">等你</span></div>
      <div class="cmd">npm run typecheck -w @alfred/ui</div>
      <div class="ask-actions"><button class="btn" data-act="allow-cmd">允许一次</button><button class="btn ghost" data-act="allow-cmd" data-session="1">本会话都允许 <code>npm run typecheck</code></button><button class="btn ghost" data-act="deny">不跑</button></div>
      <p class="ask-note">命令在任何模式下都先问：它用的是你的用户权限，不在沙箱里。</p></div>`);
  }
  if (S.step >= 3 && !S.denied) {
    out.push(S.step === 3
      ? `<div class="working">${figSlot("turn")}<code>npm run typecheck -w @alfred/ui</code><span class="mono">3s</span></div>`
      : `<div class="stepline"><span class="ok">✓</span><code>npm run typecheck -w @alfred/ui</code><span class="end">退出码 0 · 6.2s</span></div>
         <div class="stepline"><span class="ok">✓</span>改了 <code>styles.css</code><span class="end"><span class="add-n">+6</span> <span class="del-n">−12</span></span></div>`);
  }
  if (S.step >= 4 && !S.denied) {
    out.push(`<div class="msg al"><p>好了。顶部现在只有标题和用量；模型、思考强度在输入框底栏，开发会话里多一个权限模式。类型检查通过。旧的 <code>.conversation-settings</code> 样式删掉了。</p>
      <ul class="receipts"><li>改了 3 个文件 · +46 −21</li><li>类型检查通过（退出码 0）</li></ul>
      <p class="run-meta"><span>Opus 5.5</span><span>1m 12s</span><span>↑14k ↓2.1k</span><span>$0.13</span></p></div>`);
  }
  return out.join("");
}
function staticThread(s) {
  if (s.created) return `<div class="msg me"><div class="bubble">${esc(s.ask)}</div></div><div class="working">${figSlot("turn")}在读 ${project(s.project).name} 的 AGENTS.md…</div>`;
  if (s.id === "s2") {
    const done = S.extra.s2done;
    return `<div class="msg me"><div class="bubble">手机断网再连上以后，事件流没有补发，界面停在旧状态。查一下。</div></div>
      <div class="msg al">${group("读了 4 个文件", ["packages/server/src/http.ts", "packages/ui/src/useAlfred.ts", "packages/core/src/events.ts", "packages/server/test/remote.test.ts"])}
      <p>重连时浏览器带了 <code>Last-Event-ID</code>，但服务器只看查询参数，所以从"现在"开始发。改成两者都认。</p></div>
      <div class="stepline"><span class="ok">✓</span>改了 <code>server/src/http.ts</code><span class="end"><span class="add-n">+12</span> <span class="del-n">−3</span></span></div>
      ${done ? `<div class="stepline"><span class="ok">✓</span><code>npm test -w @alfred/server</code><span class="end">退出码 0 · 11s</span></div><div class="msg al"><p>测试过了。断线 30 秒再连，漏掉的 14 条事件都补上了。</p><ul class="receipts"><li>改了 1 个文件 · +12 −3</li><li>测试通过</li></ul></div>`
      : `<div class="ask"><div class="ask-h">${ic("term")}<b>跑命令</b><span>在 worktree <span class="mono">alfred/sse-reconnect</span></span><span class="tag" data-k="warm">等你</span></div><div class="cmd">npm test -w @alfred/server</div><div class="ask-actions"><button class="btn" data-act="s2-allow">允许一次</button><button class="btn ghost" data-act="s2-allow">本会话都允许 <code>npm test</code></button><button class="btn ghost">不跑</button></div></div>`}`;
  }
  return `<div class="msg me"><div class="bubble">${esc(s.title)}</div></div><div class="msg al"><p>（原型：这条会话已经结束，只放了标题。）</p></div>`;
}

function renderSession() {
  const s = sess();
  const p = project(s.project);
  const u = usage(s);
  const list = changes(s);
  const plus = list.reduce((n, f) => n + f[1], 0), minus = list.reduce((n, f) => n + f[2], 0);
  const m = MODES[s.mode];
  const extra = (S.extra[s.id] ?? []).map((x) => `<div class="msg me"><div class="bubble">${esc(x)}</div></div><div class="msg al"><p class="muted">（原型里不接模型。）</p></div>`).join("");
  const thread = (s.walk ? walkThread(s) : staticThread(s)) + extra;
  const panel = `<aside class="panel" id="panel" ${S.panel ? "" : "hidden"} aria-label="会话详情">
    <div class="sec panel-usage" style="justify-content:space-between;align-items:center">${usageHtml(u)}<button class="icon-btn" data-act="sheet-close" aria-label="关上">${ic("close")}</button></div>
    <div class="sec"><h3>环境</h3>
      <div class="kv">${ic("code")}<span>${p.name}</span></div>
      <div class="kv">${ic("folder")}<span class="mono">${s.worktree ? `~/…/worktrees/${s.id}` : p.path}</span></div>
      <div class="kv">${ic("branch")}<span class="mono">${s.worktree ?? p.branch}</span><span class="end">${s.worktree ? "worktree" : "直接在文件夹里"}</span></div>
      <div class="kv">${ic("mac")}<span>Bruce 的 Mac</span><span class="end">主节点</span></div></div>
    <div class="sec"><h3>上下文<span>${u.pct}% · 200k</span></h3><div class="meter"><i style="width:${u.pct}%"></i></div>
      <p class="small-note">AGENTS.md · git 状态 · 会话 ${u.up}k。快满时 Pi 会压缩。</p></div>
    <div class="sec"><h3>权限<span></span></h3>
      <div class="kv" data-k="${m.k}" style="color:var(--k-text)">${ic(m.icon)}<span>${m.name}</span></div>
      <p class="small-note">${m.d}</p>
      ${S.allowSession.length && s.walk ? `<p class="small-note" style="margin-top:6px">本会话允许：${S.allowSession.map((c) => `<code>${c}</code>`).join("、")}</p>` : ""}</div>
    <div class="sec"><h3>改动<span>${list.length ? `<span class="add-n">+${plus}</span> <span class="del-n">−${minus}</span>` : ""}</span></h3>
      ${list.length ? list.map(([path, a, d, isNew]) => `<button class="file" data-act="file" data-id="${path}" title="${path}"><span class="p">${path}</span>${isNew ? '<span class="new">新</span>' : ""}<span class="add-n">+${a}</span>${d ? `<span class="del-n">−${d}</span>` : ""}</button>`).join("")
        : '<p class="empty-line">这条会话还没改过文件。</p>'}
      ${list.length ? `<div class="actions"><button class="btn ghost small">提交…</button><button class="btn ghost small">开 PR…</button></div><p class="small-note" style="margin-top:6px">相对开会话时的 <code>${s.walk ? "922ed5e" : "a41c0d9"}</code>。推送和开 PR 每次都问。</p>` : ""}</div>
    <div class="sec"><h3>后台进程<span>1</span></h3><div class="kv"><span class="pulse"></span><span class="mono">vite</span><span class="end mono">localhost:5173</span></div></div>
    <div class="sec"><h3>连接器<span>3</span></h3><p class="small-note">和日常相同，来自 Alfred 自己的 mcp.json；项目里的 .pi/mcp.json 不加载。</p></div>
    <div class="sec"><h3>谁能动这条会话</h3>
      <div class="kv">${ic("mac")}<span>这台 Mac</span><span class="end">本机</span></div>
      <div class="kv">${ic("phone")}<span>Bruce 的 iPhone</span><span class="end" style="color:var(--ok)">有开发权限</span></div>
      <p class="small-note">没有开发权限的设备只看得到标题和状态。在 设置 → 设备 里逐台打开。</p></div>
  </aside>`;
  const drawer = S.diff ? `<div class="drawer"><div class="drawer-h"><button class="icon-btn" data-act="diff-close" aria-label="关上">${ic("back")}</button><span class="grow">${S.diff}</span><span class="muted">相对 ${s.walk ? "922ed5e" : "a41c0d9"}</span></div>${diffHtml(S.diff)}</div>` : "";
  $("#main").innerHTML = `<section class="session" style="position:relative">
      <header class="topbar">
        <button class="icon-btn phone-only" data-act="sheet" data-id="nav" aria-label="侧栏">${ic("menu")}</button>
        <h1>${esc(s.title)}</h1>
        <span class="where">${ic("folder")}${p.name} · ${s.worktree ?? p.branch}</span>
        ${usageHtml(u)}
        <button class="icon-btn" data-act="panel" aria-pressed="${S.panel}" aria-label="详情" title="详情">${ic("panel")}</button>
      </header>
      <div class="thread" id="thread"><div class="thread-in col">${thread}</div></div>
      <div class="col">${composer({ id: "session", mode: s.mode, placeholder: walkState() === "working" && s.walk ? "插一句话，它会在这一轮里看到…" : `在 ${p.name} 里接着说…` })}</div>
      ${drawer}
    </section>${panel}`;
  placeFigs({ turn: walkState() === "needs" ? "notice" : "work" });
  const t = $("#thread"); t.scrollTop = t.scrollHeight;
}

/* ── New session page ──────────────────────────────────────── */
function renderNew() {
  const sel = project(S.newProject);
  const trust = S.trustAsk ? project(S.trustAsk) : null;
  $("#main").innerHTML = `<div class="newpage"><div class="new-in">
    <button class="icon-btn phone-only" data-act="sheet" data-id="nav" aria-label="侧栏" style="position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px">${ic("menu")}</button>
    <div class="new-head">${figSlot("center")}<h2>新的开发会话</h2><p>选一个项目。Alfred 会在那个文件夹里读代码、改文件、跑命令，每一步按你选的权限来。</p></div>
    <div class="box"><div class="box-label">项目</div>
      ${PROJECTS.map((p) => `<button class="prow" data-act="pick" data-id="${p.id}"><span class="ck">${p.id === S.newProject ? ic("check") : ic("folder")}</span><span class="n">${p.name}</span><span class="meta">${p.trusted ? p.branch : "还没信任"}</span><span class="path">${p.path}</span></button>`).join("")}
      <button class="prow" data-act="add-folder"><span class="ck">${ic("plus")}</span><span class="n" style="font-weight:400;color:var(--copy)">添加文件夹…</span><span class="meta">只能在 Mac 上选</span><span class="path">弹出系统的选文件夹窗口</span></button>
    </div>
    ${trust ? `<div class="trust"><p><b>第一次在 ${trust.name} 里开会话：信任这个文件夹吗？</b></p>
      <ul><li>Alfred 会读它的 AGENTS.md、CLAUDE.md</li><li>会在里面读写文件、跑命令（每一步照权限模式问你）</li><li>不会加载它的 <code>.pi/settings.json</code>、<code>.pi/mcp.json</code></li></ul>
      <div class="ask-actions"><button class="btn" data-act="trust" data-id="${trust.id}">信任</button><button class="btn ghost" data-act="trust-no">算了</button></div></div>` : ""}
    <div class="box">
      <div class="opt"><span class="n">用单独的 worktree</span><span class="d">${S.newWorktree ? `在 <code>alfred/…</code> 分支上单独检出，不碰 ${sel.path} 里正在改的东西。` : `直接在 ${sel.path} 里改（当前分支 <code>${sel.branch}</code>）。`}</span><span class="end"><button class="switch" role="switch" aria-checked="${S.newWorktree}" data-act="worktree" aria-label="用单独的 worktree"></button></span></div>
      <div class="opt"><span class="n">权限模式</span><span class="d">${MODES[S.newMode].d}</span><span class="end"><span class="seg">${Object.entries(MODES).map(([k, x]) => `<button data-act="new-mode" data-id="${k}" aria-pressed="${S.newMode === k}">${x.name}</button>`).join("")}</span></span></div>
    </div>
    ${composer({ id: "new", placeholder: `想在 ${sel.name} 里做什么？`, draft: S.draft })}
    <div class="box resume"><div class="box-label">接着做</div>
      <button data-act="open" data-id="s2"><span class="k wait">等你</span><span>修 SSE 断线重连</span><span class="s">一条命令等批准</span></button>
      <button data-act="open" data-id="s1"><span class="k">在做</span><span>对话框改成共用组件</span><span class="s">Alfred</span></button>
      <button><span class="k">未提交</span><span>Alfred 里有 41 个文件的改动</span><span class="s">从这里接着改</span></button>
    </div>
  </div></div>`;
  placeFigs({ center: trust ? "notice" : "hello" });
}

/* ── Daily: page plus the Alfred panel ─────────────────────── */
function renderDaily() {
  const h = S.dailyHandoff;
  $("#main").innerHTML = `<div class="daily-page">
      <h1 data-k="blue">${ic("todo")}待办</h1><p class="sub">3 件今天要做，1 件逾期</p>
      ${[["交 11 月的报销", "逾期 1 天", "yellow"], ["给 Mia 回站会的事", "今天", "blue"], ["订周六的火车票", "今天", "orange"], ["看 Alfred 设置页的保存按钮", "今天", "blue"]].map(([t, m, k]) => `<div class="todo" data-k="${k}"><span class="check"></span><span>${t}</span><span class="meta">${m}</span></div>`).join("")}
    </div>
    <aside class="alfred" aria-label="Alfred">
      <header class="alf-head">${figSlot("head")}<div style="flex:1;min-width:0"><div class="alf-name">Alfred <span class="ctxchip">在看 · 待办</span></div><p class="alf-line">逾期的那件报销我能直接做。</p></div>
        <button class="icon-btn phone-only" data-act="sheet" data-id="nav" aria-label="侧栏">${ic("menu")}</button><button class="icon-btn" aria-label="收起">${ic("panel")}</button></header>
      <div class="conv-head"><span class="t">报销和杂事</span>${usageHtml({ up: 12, down: 1.4, cost: 0.05, pct: 8 })}</div>
      <div class="thread"><div class="thread-in">
        <div class="msg me"><span class="from-page">在「待办」页问的</span><div class="bubble">报销那件你办了吧</div></div>
        <div class="msg al"><p>交了。11 月 6 张票，¥1,284，审批人是 Leo。</p><ul class="receipts"><li>报销单 · 已提交</li><li>待办 · 交 11 月的报销 → 完成</li></ul><p class="run-meta"><span>Sonnet 5.5</span><span>18s</span><span>$0.02</span></p></div>
        <div class="msg me"><span class="from-page">在「待办」页问的</span><div class="bubble">顺手把 Alfred 设置页的保存按钮改成自动保存</div></div>
        <div class="msg al"><p>这要改代码。日常对话里我不能改文件，也不能跑命令。</p>
          ${h === "open" ? `<div class="handoff"><p>在「Alfred」项目里开一个开发会话？我写好了说明，会放进输入框，你看过再发。</p>
            <blockquote>设置页（packages/ui/src/Settings.tsx）去掉保存按钮，改成每项改完就存；存的时候在那一项旁边显示「已保存」，失败就显示原因并保留输入。</blockquote>
            <div class="ask-actions"><button class="btn alf" data-act="handoff">开开发会话</button><button class="btn ghost" data-act="handoff-no">不用</button></div></div>`
          : h === "no" ? `<p class="muted">好，先放着。待办里那一条留着。</p>` : `<p class="muted">已在「Alfred」项目里开了。</p>`}
        </div>
      </div></div>
      ${composer({ id: "daily", placeholder: "跟 Alfred 说…" })}
    </aside>`;
  placeFigs({ head: "rest" });
}

/* ── Render, proto bar, events ─────────────────────────────── */
function protoHtml() {
  const sc = [["new", "新会话"], ["session", "开发会话"], ["daily", "日常→转开发"]];
  const sch = [["auto", "跟随"], ["light", "浅"], ["dark", "深"]];
  return `<b>原型 · 场景</b>${sc.map(([k, l]) => `<button data-act="scene" data-id="${k}" aria-pressed="${S.scene === k}">${l}</button>`).join("")}<button data-act="reset">重来</button><i></i>${sch.map(([k, l]) => `<button data-act="scheme" data-id="${k}" aria-pressed="${scheme === k}">${l}</button>`).join("")}`;
}
function render() {
  if (S.scene === "session") renderSession(); else if (S.scene === "new") renderNew(); else renderDaily();
  renderSide();
  if (S.sheet) document.body.dataset.sheet = S.sheet; else delete document.body.dataset.sheet;
}

const timers = [];
const later = (ms, fn) => timers.push(setTimeout(() => { fn(); render(); }, ms));
function allowEdit() { S.step = 1; later(1100, () => { S.step = 2; }); }

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) { if (S.menu && !e.target.closest(".menu")) { S.menu = null; render(); } return; }
  const { act, id } = el.dataset;
  if (act !== "menu") S.menu = null;
  switch (act) {
    case "scene": S.scene = id; S.sheet = null; S.diff = null; if (id === "new") S.trustAsk = null; break;
    case "reset": timers.forEach(clearTimeout); timers.length = 0; S = { ...fresh(), scene: S.scene }; SESSIONS[0].mode = "ask"; SESSIONS[1].static = "needs"; PROJECTS[2].trusted = false; PROJECTS[2].open = false; break;
    case "scheme": scheme = id; applyTheme(); break;
    case "open": S.scene = "session"; S.current = id; S.sheet = null; S.diff = null; break;
    case "proj": { const p = project(id); p.open = !p.open; break; }
    case "panel": if (matchMedia("(max-width: 760px)").matches) S.sheet = "panel"; else S.panel = !S.panel; break;
    case "sheet": S.sheet = id; break;
    case "sheet-close": S.sheet = null; break;
    case "menu": S.menu = S.menu === id ? null : id; break;
    case "set-model": S.model = id; break;
    case "set-think": S.think = id; break;
    case "set-mode": {
      if (el.dataset.for === "new") { S.newMode = id; break; }
      const s = sess(); s.mode = id;
      // Switching to "edits" while an edit waits: it goes ahead, since it is inside the project.
      if (s.walk && id === "edits" && S.step === 0 && !S.denied) allowEdit();
      break;
    }
    case "allow-edit": allowEdit(); break;
    case "allow-cmd": if (el.dataset.session) S.allowSession.push("npm run typecheck"); S.step = 3; later(1600, () => { S.step = 4; }); break;
    case "deny": S.denied = true; break;
    case "s2-allow": S.extra.s2done = true; SESSIONS[1].static = "done"; break;
    case "file": S.diff = id; S.sheet = null; break;
    case "diff-close": S.diff = null; break;
    case "pick": { const p = project(id); S.newProject = id; S.trustAsk = p.trusted ? null : id; break; }
    case "trust": project(id).trusted = true; project(id).open = true; S.trustAsk = null; break;
    case "trust-no": S.trustAsk = null; S.newProject = "alfred"; break;
    case "add-folder": alert("（原型）这里在 Mac 上弹出系统的选文件夹窗口。手机和浏览器上这一项是灰的。"); break;
    case "worktree": S.newWorktree = !S.newWorktree; break;
    case "new-mode": S.newMode = id; break;
    case "handoff": S.dailyHandoff = "done"; S.scene = "new"; S.newProject = "alfred"; S.trustAsk = null; S.newMode = "ask";
      S.draft = "设置页（packages/ui/src/Settings.tsx）去掉保存按钮，改成每项改完就存；存的时候在那一项旁边显示「已保存」，失败就显示原因并保留输入。"; break;
    case "handoff-no": S.dailyHandoff = "no"; break;
  }
  render();
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const form = e.target.dataset.form;
  const input = e.target.querySelector("textarea");
  const text = input.value.trim();
  if (!text) return;
  if (form === "new") {
    if (S.trustAsk) return;
    const id = `n${S.created.length + 1}`;
    const title = text.replace(/\s+/g, " ").slice(0, 16) + (text.length > 16 ? "…" : "");
    S.created.push({ id, project: S.newProject, title, t: "现在", mode: S.newMode, worktree: S.newWorktree ? `alfred/${id}` : null, created: true, ask: text });
    project(S.newProject).open = true;
    S.draft = ""; S.scene = "session"; S.current = id;
  } else if (form === "session") {
    (S.extra[S.current] ??= []).push(text);
  }
  render();
});
document.addEventListener("input", (e) => { if (e.target.dataset.input === "new") S.draft = e.target.value; });
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.target.matches("textarea")) { e.preventDefault(); e.target.form.requestSubmit(); }
  if (e.key === "Escape") { S.menu = null; S.diff = null; S.sheet = null; render(); }
});

applyTheme();
render();
</script>
</body>
</html>
