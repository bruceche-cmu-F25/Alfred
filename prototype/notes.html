<!doctype html>
<!--
  Alfred: Notes. A prototype for docs/design/notes.md: no build step, sample notes, and scripts in place of the disk,
  the file watcher and the model.
  The question it asks: what is a note in Alfred when the truth is a Markdown file in a folder?
    List     three ways in: recent, the folder new notes land in (随手记 / Quick Notes), and folders as one flat list.
             In Quick Notes, Alfred's guess at where a note belongs is a dashed chip; a click moves the file.
    Read     a note takes the whole page (a note is long; the pop-up card is for short things, and is still used
             here to confirm a delete). Double links open the other note; a link to a note that does not exist is
             dashed and makes it. An address that was saved in Links shows as that clip. Under the note: who links
             here, and addresses not saved yet.
    Write    the Markdown source, coloured, saved a moment after you stop. Typing [[ offers note names. (The app
             will use CodeMirror 6; here it is a textarea over a coloured copy of the same text.)
    Elsewhere  "changed elsewhere" in the strip plays another app writing the same file. While reading, the note
             just changes. While writing, your text is not saved over it: keep theirs, or save yours as a copy.
    Alfred   while reading, the line at the bottom carries the note: say what to change and Alfred proposes it in
             place (dashed, old line struck through). Yes / change / no. A proposal goes stale if the file changes.
  The line at the bottom on the list: a few words and return makes a note in Quick Notes; the same words also
  search what the notes say.
-->
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alfred：笔记</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<style>
:root {
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.23, 1, .32, 1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
h1, h2, h3, h4, p, ul, ol, pre, blockquote { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--alf); outline-offset: 2px; }
.grow { flex: 1; min-width: 0; }

/* ── The prototype's own strip ── */
.proto { flex: none; display: flex; align-items: center; gap: 4px; padding: 6px 10px; background: var(--ink); color: var(--bg); font-size: 12px; overflow-x: auto; white-space: nowrap; }
.proto b { flex: none; padding: 0 6px; }
.proto .lab { flex: none; padding: 0 4px 0 10px; opacity: .6; }
.proto button, .proto a { flex: none; height: 26px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 8px; opacity: .72; text-decoration: none; }
.proto button:hover, .proto a:hover { opacity: 1; }
.proto button[aria-pressed="true"] { background: var(--bg); color: var(--ink); opacity: 1; }
.proto .what { flex: 1; min-width: 0; padding: 0 10px; opacity: .7; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1100px) { .proto .what { display: none; } }
@media (max-width: 620px) { .proto .lab, .proto b { display: none; } }

/* ── The page ── */
.page { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; container: page / inline-size; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 0 170px; }
.page[data-view="edit"] .scroll { padding-bottom: 60px; }
.col { max-width: 860px; margin: 0 auto; padding: 0 28px; }
.page[data-view="read"] .col, .page[data-view="edit"] .col { max-width: 740px; }
.page-head { padding: 22px 0 6px; }
.page-head h1 { display: flex; align-items: center; gap: 10px; font-size: 1.625rem; line-height: 1.25; font-weight: 650; letter-spacing: -.01em; }
.page-head h1 svg { width: 24px; height: 24px; color: var(--k-solid); }
.page-head p { margin-top: 4px; color: var(--muted); font-size: .875rem; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 16px 0 10px; }
.chip { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); color: var(--copy); font-size: .8125rem; white-space: nowrap; }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--pick); color: var(--on-pick); box-shadow: none; }
.chip .n { font-size: .75rem; opacity: .7; }

/* A note in a list: its name, how it starts, where it is, when it changed. */
.rows { display: flex; flex-direction: column; }
.row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; padding: 2px 10px; margin: 0 -10px; border-radius: 12px; transition: background 200ms var(--ease); }
.row + .row::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 1px; background: var(--line-soft); }
.row:hover { background: var(--wash); }
.row:hover::before, .row:hover + .row::before, .row[data-fresh]::before, .row[data-fresh] + .row::before { display: none; }
.row[data-fresh] { background: var(--alf-soft); }
.row-main { min-width: 0; display: flex; flex-direction: column; gap: 1px; padding: 9px 0; border-radius: 8px; }
.rt { font-weight: 550; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rs { color: var(--muted); font-size: .8125rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rs:empty::before { content: "\00a0"; }
.rm { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .75rem; white-space: nowrap; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 6px; background: var(--k-fill, var(--wash)); color: var(--k-text, var(--copy)); font-size: .75rem; font-weight: 500; white-space: nowrap; }
.sug { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; border: 1px dashed var(--k-line); background: var(--k-fill); color: var(--k-text); font-size: .75rem; white-space: nowrap; }
.sug:hover { border-style: solid; }
.when { min-width: 3.2em; text-align: right; }
.empty { padding: 36px 0; color: var(--muted); font-size: .875rem; }
.empty b { display: block; margin-bottom: 4px; color: var(--ink); font-size: 1rem; font-weight: 600; }
.path { font: .75rem/1.6 var(--mono); color: var(--muted); overflow-wrap: anywhere; }

/* Folders: one flat list, a line each. */
.folders li + li { box-shadow: 0 -1px 0 var(--line-soft); }
.folders button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 10px; margin: 0 -10px; width: calc(100% + 20px); border-radius: 12px; }
.folders button:hover { background: var(--wash); }
.folders svg { color: var(--muted); }
.folders .n { color: var(--muted); font-size: .75rem; }
.folders .mark { color: var(--muted); font-size: .75rem; }
.crumb { display: flex; align-items: center; gap: 6px; padding: 0 0 6px; color: var(--muted); font-size: .8125rem; }
.crumb button { color: var(--copy); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.crumb b { color: var(--ink); font-weight: 600; }
.lib { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 22px; padding-top: 14px; box-shadow: 0 -1px 0 var(--line-soft); color: var(--muted); font-size: .8125rem; }

.btn { min-height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); color: var(--copy); font-size: .8125rem; white-space: nowrap; text-decoration: none; }
.btn:hover { color: var(--ink); }
.btn.solid { background: var(--alf-solid); color: var(--on-alf); box-shadow: none; }
.btn.danger { background: var(--now); color: var(--on-alf); box-shadow: none; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg.i { width: 15px; height: 15px; }
.ib { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 50%; color: var(--copy); }
.ib:hover { background: var(--wash); color: var(--ink); }
.move { height: 30px; padding: 0 10px; border: 0; border-radius: 999px; background: none; box-shadow: inset 0 0 0 1px var(--line); color: var(--copy); font-size: .8125rem; max-width: 150px; }

/* ── One note, the whole page ── */
.bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 12px 0 10px; background: var(--bg); }
.back { display: inline-flex; align-items: center; gap: 2px; height: 30px; padding: 0 10px 0 4px; margin-left: -4px; border-radius: 999px; color: var(--copy); font-size: .875rem; }
.back:hover { background: var(--wash); color: var(--ink); }
.status { color: var(--muted); font-size: .8125rem; }
.note > h1 { padding-top: 8px; font-size: 1.625rem; line-height: 1.3; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
.props { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 6px; color: var(--muted); font-size: .8125rem; }
.props .sep { opacity: .5; }

.md { padding-top: 14px; color: var(--copy); overflow-wrap: anywhere; }
.md > * + * { margin-top: .8em; }
.md h2 { margin-top: 1.5em; color: var(--ink); font-size: 1.1875rem; font-weight: 650; }
.md h3 { margin-top: 1.3em; color: var(--ink); font-size: 1.0625rem; font-weight: 600; }
.md h4 { margin-top: 1.2em; color: var(--ink); font-size: .9375rem; font-weight: 600; }
.md ul { list-style: disc; padding-left: 1.3em; }
.md ol { list-style: decimal; padding-left: 1.5em; }
.md li + li { margin-top: .25em; }
.md li::marker { color: var(--muted); }
.md li.task { list-style: none; margin-left: -1.3em; display: flex; gap: 9px; }
.md li.plain { list-style: none; margin-left: -1.3em; }
.md ol li.plain { margin-left: -1.5em; }
.md [data-fresh] { background: var(--alf-soft); border-radius: 6px; box-shadow: 0 0 0 4px var(--alf-soft); }
.box { flex: none; width: 16px; height: 16px; margin-top: .3em; display: grid; place-items: center; border-radius: 5px; box-shadow: inset 0 0 0 1.5px var(--line); }
.box[aria-checked="true"] { background: var(--alf-solid); box-shadow: none; }
.box[aria-checked="true"]::after { content: ""; width: 8px; height: 4px; margin-top: -2px; border-left: 1.8px solid var(--on-alf); border-bottom: 1.8px solid var(--on-alf); transform: rotate(-45deg); }
.box[aria-checked="true"] + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.md strong { color: var(--ink); font-weight: 600; }
.md code { padding: 1px 5px; border-radius: 5px; background: var(--wash); font: .8125rem var(--mono); }
.md pre.code { padding: 12px 14px; border-radius: 10px; background: var(--wash); overflow-x: auto; }
.md pre.code code { padding: 0; background: none; white-space: pre; }
.md blockquote { padding: 2px 0 2px 14px; box-shadow: inset 2px 0 0 var(--line); color: var(--muted); }
.wl { color: var(--alf); text-decoration: underline; text-decoration-color: color-mix(in oklch, var(--alf) 35%, transparent); text-underline-offset: 3px; cursor: pointer; }
.wl.missing { text-decoration-style: dashed; text-decoration-color: var(--alf); opacity: .8; }
.ext { color: var(--alf); text-decoration: underline; text-decoration-color: color-mix(in oklch, var(--alf) 35%, transparent); text-underline-offset: 3px; }
/* An address that is already in Links shows as that clip. */
.clip { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; height: 26px; padding: 0 9px 0 3px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); vertical-align: middle; text-decoration: none; color: var(--copy); font-size: .8125rem; }
.clip:hover { color: var(--ink); background: var(--wash); }
.clip .tile { flex: none; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 6px; background: var(--k-fill); color: var(--k-text); font: 600 .625rem/1 var(--sans); }
.clip .ct { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.clip .cs { flex: none; color: var(--muted); font-size: .75rem; }
.embed { display: flex; align-items: center; gap: 10px; padding: 18px 14px; border-radius: 10px; background: var(--wash); color: var(--muted); font-size: .8125rem; }

/* Alfred's change, where it would land: dashed, with what it replaces struck through. */
.prop { margin: 4px 0; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--k-line); background: var(--k-fill); }
.prop .was { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.prop .will { color: var(--ink); min-height: 1.6em; }
.prop .stale { color: var(--muted); font-size: .875rem; }
.prop .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
.prop .who { color: var(--k-text); font-size: .75rem; }

.under { margin-top: 30px; padding-top: 14px; box-shadow: 0 -1px 0 var(--line-soft); }
.under h2 { margin-bottom: 6px; color: var(--muted); font-size: .8125rem; font-weight: 500; }
.under li { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; min-width: 0; font-size: .875rem; }
.under .bt { flex: none; max-width: 45%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.under .bs { min-width: 0; flex: 1; color: var(--muted); font-size: .8125rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* ── Writing ── */
.conflict { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 10px; background: var(--k-fill); color: var(--k-text); font-size: .8125rem; }
.title-in { width: 100%; margin-top: 8px; padding: 0; border: 0; outline: none; background: none; font-size: 1.625rem; line-height: 1.3; font-weight: 650; letter-spacing: -.01em; }
.ed { position: relative; margin-top: 14px; min-height: 46vh; }
.ed .hl, .ed textarea, .ed .mirror { font: .9375rem/1.75 var(--sans); white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; tab-size: 2; letter-spacing: 0; }
.ed .hl { color: var(--copy); pointer-events: none; min-height: 46vh; }
.ed .hl .hd { color: var(--ink); }
.ed .hl .dim { color: var(--muted); }
.ed .hl .lk { color: var(--alf); }
.ed textarea { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; outline: none; resize: none; overflow: hidden; background: none; color: transparent; caret-color: var(--ink); }
.ed textarea::selection { background: color-mix(in oklch, var(--alf) 22%, transparent); }
.ed .mirror { position: absolute; inset: 0 0 auto 0; visibility: hidden; pointer-events: none; }
.ac { position: absolute; z-index: 3; width: 240px; max-width: 100%; padding: 4px; border-radius: 12px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line), var(--shadow); font-size: .875rem; }
.ac button { width: 100%; display: flex; align-items: baseline; gap: 8px; padding: 6px 9px; border-radius: 8px; min-width: 0; }
.ac button[aria-selected="true"] { background: var(--wash); }
.ac .at { min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ac small { flex: none; color: var(--muted); font-size: .75rem; }
.ac .none { padding: 6px 9px; color: var(--muted); font-size: .8125rem; }
.edhint { margin-top: 14px; color: var(--muted); font-size: .75rem; }
.edhint code { font: .75rem var(--mono); }

@container page (max-width: 560px) {
  .col { padding: 0 16px; }
  .row { grid-template-columns: minmax(0, 1fr); padding-bottom: 9px; }
  .row-main { padding-bottom: 2px; }
  .rm { flex-wrap: wrap; }
  .when { min-width: 0; text-align: left; }
  .under .bt { max-width: 60%; }
  .bar { flex-wrap: nowrap; }
  .back { padding: 0 4px; }
  .back span { display: none; }
  .move { max-width: 100px; }
}

/* ── The line at the bottom ── */
.line-wrap { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 16px; pointer-events: none; background: linear-gradient(to top, var(--bg) 62%, transparent); }
.page[data-view="edit"] .line-wrap { display: none; }
.line-col { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
#toast:empty, #above:empty, #tries:empty { display: none; }
.toast { width: fit-content; margin: 0 auto; display: flex; align-items: center; gap: 10px; max-width: 100%; padding: 6px 8px 6px 14px; border-radius: 999px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line), var(--shadow); color: var(--copy); font-size: .8125rem; }
.toast span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.toast button { flex: none; height: 24px; padding: 0 10px; border-radius: 999px; color: var(--alf); }
.toast button:hover { background: var(--alf-soft); }
.above { border-radius: 14px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line), var(--shadow); overflow: hidden; }
.will-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line-soft); font-size: .875rem; min-width: 0; }
.will-row:first-child { border-top: 0; }
.will-row b { flex: none; font-weight: 600; white-space: nowrap; }
.will-row .u { min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: .8125rem; }
.will-row kbd { flex: none; padding: 1px 6px; border-radius: 5px; background: var(--wash); color: var(--muted); font: .6875rem var(--mono); }
.hit { display: block; width: 100%; padding: 9px 14px; border-top: 1px solid var(--line-soft); min-width: 0; }
.hit:first-child { border-top: 0; }
.hit:hover { background: var(--wash); }
.hit .ht { display: flex; align-items: baseline; gap: 8px; font-size: .875rem; }
.hit .ht span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.hit .ht small { flex: none; color: var(--muted); font-size: .75rem; }
.hit .hs { display: block; color: var(--muted); font-size: .8125rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
mark { background: var(--alf-soft); color: var(--ink); border-radius: 3px; }
.tries { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tries::-webkit-scrollbar { display: none; }
.tries button { flex: none; height: 28px; padding: 0 11px; border-radius: 999px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); color: var(--copy); font-size: .8125rem; white-space: nowrap; }
.line { display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 8px 0 16px; border-radius: 16px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line), var(--shadow); }
.line:focus-within { box-shadow: inset 0 0 0 1.5px var(--alf), var(--shadow); }
.line input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; }
.line input::placeholder { color: var(--muted); }
#hang { flex: none; max-width: 42%; min-width: 0; display: flex; }
#hang:empty { display: none; }
.hang { max-width: 100%; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: var(--alf-soft); color: var(--alf); font-size: .8125rem; }
.hang span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.line .mic { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: var(--copy); }
.line .mic:hover { background: var(--wash); }
.line .mic[aria-pressed="true"] { background: var(--alf-soft); color: var(--alf); }
.line .go { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--alf-solid); color: var(--on-alf); }
.line .go:disabled { background: var(--wash); color: var(--muted); cursor: default; }
.pulse { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--alf); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }

/* ── A small thing to confirm: a card over the blurred page ── */
.pop { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px; background: color-mix(in oklch, var(--bg) 40%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fade 160ms var(--ease); }
.pop-card { width: min(380px, 100%); padding: 20px; border-radius: 18px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft), 0 2px 6px oklch(0 0 0 / .08), 0 24px 70px oklch(0 0 0 / .22); }
.pop-card h2 { font-size: 1.0625rem; font-weight: 650; overflow-wrap: anywhere; }
.pop-card p { margin-top: 6px; color: var(--copy); font-size: .875rem; }
.pop-card .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pulse, .pop { animation: none; } }
</style>
</head>
<body>
<div class="proto" id="proto"></div>
<main class="page" id="main" data-k="yellow" data-view="list">
  <div class="scroll" id="scroll"><div class="col" id="page"></div></div>
  <div class="line-wrap"><div class="line-col">
    <div id="toast"></div>
    <div id="above"></div>
    <div id="tries"></div>
    <form class="line" id="lineform">
      <span id="hang"></span>
      <input id="draft" autocomplete="off" spellcheck="false">
      <button type="button" class="mic" id="mic" data-a="mic"><svg class="i" viewBox="0 0 20 20"><rect x="7.5" y="3" width="5" height="9" rx="2.5"/><path d="M5 10a5 5 0 0010 0M10 15v2.5"/></svg></button>
      <button type="submit" class="go" id="go"><svg class="i" viewBox="0 0 20 20"><path d="M4 10h11M11 5l5 5-5 5"/></svg></button>
    </form>

function search(query) {

  return S.notes.map((note) => {
    const { lines, start } = parts(body(note));
    const candidates = lines.slice(start).map(plain).filter(Boolean);
    const best = candidates.reduce((top, line) => (count(line) > count(top) ? line : top), "");

function renderAll() { renderStrip(); renderPage(); renderLine(); renderPop(); }

// Alfred writes where you can see it: the new line types out. A click, or reduced motion, gives it at once.
function typeOut() {
  const el = document.querySelector("[data-typing]"), P = S.proposal;
  if (!el || !P || P.typed) return;
  P.typed = true;
  if (still) return;
  const full = el.innerHTML, text = el.textContent, step = Math.max(1, Math.round(text.length / 36));
  let shown = 0;
  el.textContent = "";
  const timer = setInterval(() => {
    shown += step;
    if (shown >= text.length || !el.isConnected) { clearInterval(timer); if (el.isConnected) el.innerHTML = full; }
    else el.textContent = text.slice(0, shown);
  }, 32);
  el.addEventListener("click", () => { clearInterval(timer); el.innerHTML = full; }, { once: true });
}

/* ── Writing ── */
let saveTimer = 0;
function enterEdit(id) {
  const note = byId(id);
  Object.assign(S, { view: "edit", open: id, ac: null, edit: { base: body(note), draft: body(note), title: titleOf(note), status: "saved", conflict: false } });
  renderAll();
  $("scroll").scrollTop = 0;
  const area = $("src");
  area.focus();
  area.setSelectionRange(area.value.length, area.value.length);
}
function paintEditor() { $("hl").innerHTML = highlight($("src").value); }
function paintStatus() {
  const E = S.edit;
  $("status").textContent = E.conflict ? t("没存", "Not saved") : E.status === "saving" ? t("在存…", "Saving…") : t("已存", "Saved");
  $("done").disabled = E.conflict;
}
function paintConflict() { $("conflict").hidden = !S.edit.conflict; }
function onEdit() {
  const E = S.edit;
  E.draft = $("src").value;
  E.status = "saving";
  paintEditor(); paintStatus(); paintAc();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDraft, 900);
}
// Saving carries what the file was when it was opened. If the file is no longer that, nothing is written over it.
function saveDraft() {
  const E = S.edit, note = byId(S.open);
  if (!E || !note || E.conflict) return;
  clearTimeout(saveTimer);
  if (body(note) !== E.base) { E.conflict = true; paintStatus(); paintConflict(); return; }
  if (E.draft !== E.base) { setBody(note, E.draft); E.base = E.draft; note.elsewhere = false; }
  E.status = "saved";
  paintStatus();
}
function finishEdit() {
  const E = S.edit, note = byId(S.open);
  if (!E || E.conflict) return;
  saveDraft();
  const old = titleOf(note), name = $("title").value.trim();
  let moved = 0;
  if (name && name !== old && !byTitle(name)) {
    // Renaming here also rewrites the double links that pointed at the old name.
    const pattern = new RegExp(`\\[\\[${old.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(\\|[^\\]\\n]*)?\\]\\]`, "g");
    for (const other of S.notes) {
      const before = other.text[L()], after = before.replace(pattern, (m, alias) => { moved++; return `[[${name}${alias ?? ""}]]`; });
      if (after !== before) other.text[L()] = after;
    }
    note.title[L()] = name;
    touch(note);
  }
  Object.assign(S, { view: "read", edit: null, ac: null });
  renderAll();
  if (name && name !== old && titleOf(note) === name) say(moved ? t(`改了名 · ${moved} 处双链跟着改了`, `Renamed · ${moved} ${moved === 1 ? "link" : "links"} updated`) : t("改了名", "Renamed"));
}
// The [[ menu sits at the caret: a hidden copy of the text up to the caret says where that is.
function paintAc() {
  const area = $("src"), menu = $("ac");
  if (!area) return;
  const head = area.value.slice(0, area.selectionStart);
  const open = area.selectionStart === area.selectionEnd ? /\[\[([^\[\]\n|]*)$/.exec(head) : null;
  if (!open) { S.ac = null; menu.hidden = true; return; }
  const items = S.notes.filter((note) => note.id !== S.open && titleOf(note).toLowerCase().includes(open[1].toLowerCase())).slice(0, 5);
  S.ac = { from: head.length - open[1].length, q: open[1], items, index: Math.min(S.ac?.index ?? 0, Math.max(items.length - 1, 0)) };
  const mirror = $("mirror");
  mirror.innerHTML = `${esc(head)}<span>​</span>`;
  const at = mirror.lastElementChild;
  menu.style.top = `${at.offsetTop + at.offsetHeight + 4}px`;
  menu.style.left = `${Math.max(0, Math.min(at.offsetLeft, $("ed").clientWidth - 240))}px`;
  menu.innerHTML = items.length
    ? items.map((note, i) => `<button type="button" data-a="ac" data-i="${i}" aria-selected="${i === S.ac.index}"><span class="at">${esc(titleOf(note))}</span><small>${esc(pick(folderOf(note.folder).name))}</small></button>`).join("")
    : `<div class="none">${t("没有这篇 · 照样能连", "No such note · link it anyway")}</div>`;
  menu.hidden = false;
}
function pickAc(index) {
  const area = $("src"), { from, q, items } = S.ac, name = titleOf(items[index]), text = area.value, end = from + q.length;
  area.value = text.slice(0, from) + name + (text.slice(end).startsWith("]]") ? "" : "]]") + text.slice(end);
  const caret = from + name.length + 2;
  area.focus();
  area.setSelectionRange(caret, caret);
  onEdit();
}

/* ── Acting ── */
function openNote(id) {
  Object.assign(S, { view: "read", open: id, revising: false });
  if (S.proposal && S.proposal.note !== id) S.proposal = null;
  $("draft").value = "";
  renderAll();
  $("scroll").scrollTop = 0;
}
function newNote(title, text, folder = "quick", more = {}) {
  const note = { id: `x${Date.now()}`, folder, days: 0, just: true, title: [title, title], text: [text, text], ...more };
  S.notes.unshift(note);
  S.empty = false;
  return note;
}
function capture(text) {
  const clean = text.trim();
  const cut = /^[^。！？.!?\n]{1,24}/.exec(clean)?.[0].trim() ?? "";
  const name = cut && !byTitle(cut) ? cut : `${TODAY} ${new Date().toTimeString().slice(0, 5).replace(":", "-")}`;
  const note = newNote(name, md("---", `created: ${TODAY}`, "---", clean));
  $("draft").value = "";
  if (S.tab === "folders") S.tab = "quick";
  flash(note.id);
  renderAll();
  $("scroll").scrollTo({ top: 0, behavior: still ? "auto" : "smooth" });
  say(t("记进了随手记", "Saved to Quick Notes"), () => { S.notes = S.notes.filter((other) => other !== note); });
}
async function propose(text) {
  const note = byId(S.open), script = SCRIPT[note.id];
  const again = S.revising && S.proposal;
  S.thinking = true;
  $("draft").value = "";
  renderLine();
  await sleep(still ? 0 : 900);
  S.thinking = false;
  const said = text.replace(/^(补一句|加一句|Add)[:：]\s*/i, "").trim();
  if (script && body(note).split("\n").includes(script.find[L()])) S.proposal = { note: note.id, find: script.find[L()], to: (again ? script.again : script.to)[L()], typed: false, stale: false };
  else S.proposal = { note: note.id, find: null, to: said, typed: false, stale: false };
  S.revising = false;
  renderAll();
  document.querySelector(".prop")?.scrollIntoView({ block: "center", behavior: still ? "auto" : "smooth" });
}
function accept() {
  const P = S.proposal, note = byId(P.note), before = body(note), lines = before.split("\n");
  if (P.find !== null) lines[lines.indexOf(P.find)] = P.to;
  setBody(note, P.find !== null ? lines.join("\n") : `${before.replace(/\n+$/, "")}\n\n${P.to}`);
  Object.assign(S, { proposal: null, revising: false, freshLine: P.to });
  renderAll();
  say(P.find !== null ? t("Alfred 改了一处", "Alfred changed one line") : t("Alfred 加了一句", "Alfred added a line"), () => { note.text[L()] = before; });
  setTimeout(() => { S.freshLine = null; if (S.view === "read") renderPage(); }, 2600);
}
// Another app writes the same file. Reading: the note just changes. Writing: your text is not saved over it.
function elsewhere() {
  const note = byId(S.open);
  if (S.view === "list" || !note) {
    const made = newNote(t("重排", "Reranking"), t("重排是最便宜的提升，放在最后做。", "Reranking is the cheapest gain; do it last."), "tech");
    S.tab = "recent";
    flash(made.id);
    renderAll();
    return say(t("别处新建了一篇", "A note was made elsewhere"));
  }
  note.text[L()] = `${body(note).replace(/\n+$/, "")}\n\n${t("- （在别处加的一行）", "- (a line added elsewhere)")}`;
  note.elsewhere = true;
  if (S.proposal?.note === note.id) S.proposal.stale = true;
  if (S.view === "edit") {
    const E = S.edit;
    if (E.draft === E.base) { E.base = E.draft = body(note); $("src").value = E.draft; paintEditor(); }
    else { clearTimeout(saveTimer); E.conflict = true; paintStatus(); paintConflict(); }
    return;
  }
  renderPage();
}
function fromLink() {
  const clip = { url: "https://www.youtube.com/watch?v=ragfromscratch", site: "YouTube", mark: "▶", k: "now", title: ["从零搭一个 RAG", "RAG from scratch"] };
  if (!clipOf(clip.url)) S.clips.push(clip);
  const name = pick(clip.title);
  const note = byTitle(name) ?? newNote(name, md("---", `created: ${TODAY}`, `source: ${clip.url}`, "---", t("想对照着改 Alfred 的搜索。", "To compare with Alfred's search.")), "quick", { suggest: "tech" });
  S.tab = "quick";

}
async function listen() {
  if (S.listening) return;
  const draft = $("draft"), text = t("面试前把系统设计的套路过一遍", "Go over the system design steps before the interview");
  S.listening = true;
  draft.value = "";
  renderLine();
  await sleep(still ? 0 : 900);
  for (let i = 1; i <= text.length && !still; i += 2) { draft.value = text.slice(0, i); await sleep(40); }
  draft.value = text;
  S.listening = false;
  renderLine();

}

document.addEventListener("click", (event) => {
  const el = event.target.closest("[data-a]");
  if (!el) return;
  const d = el.dataset, note = byId(S.open);
  switch (d.a) {
    case "noop": event.preventDefault(); return;
    case "lang": if (S.view === "edit") finishEdit(); S.lang = S.lang === "en" ? "zh" : "en"; S.proposal = null; return renderAll();
    case "scheme": { const root = document.documentElement; root.dataset.scheme = root.dataset.scheme === "dark" ? "light" : "dark"; return; }
    case "reset": seed(); return renderAll();
    case "empty": { const was = S.empty; seed(); if (!was) { S.notes = []; S.empty = true; } return renderAll(); }
    case "ext": return elsewhere();
    case "fromlink": if (S.view === "edit") finishEdit(); return fromLink();
    case "tab": S.tab = d.id; S.folder = ""; return renderPage();
    case "folder": S.folder = d.id; return renderPage();
    case "note": case "hit": case "wl": return openNote(d.id);
    case "new": { const made = newNote(d.title, ""); return enterEdit(made.id); }
    case "suggest": {
      const moving = byId(d.id), from = moving.folder;
      moving.folder = moving.suggest;
      renderPage();
      return say(t(`挪到了 ${pick(folderOf(moving.folder).name)}`, `Moved to ${pick(folderOf(moving.folder).name)}`), () => { moving.folder = from; });
    }
    case "back": Object.assign(S, { view: "list", open: null, proposal: null, revising: false }); $("draft").value = ""; return renderAll();
    case "edit": return enterEdit(S.open);
    case "done": return finishEdit();
    case "del": S.pop = "del"; return renderPop();
    case "pop-close": if (event.target === el) { S.pop = null; renderPop(); } return;
    case "del-yes": {
      const at = S.notes.indexOf(note);
      S.notes.splice(at, 1);
      Object.assign(S, { pop: null, view: "list", open: null, proposal: null });
      renderAll();
      return say(t("挪进了 .trash", "Moved to .trash"), () => { S.notes.splice(at, 0, note); });
    }
    case "task": {
      const lines = body(note).split("\n"), i = Number(d.line);
      lines[i] = lines[i].replace(/^- \[( |x)\]/, (m, mark) => (mark === "x" ? "- [ ]" : "- [x]"));
      setBody(note, lines.join("\n"));
      return renderPage();
    }
    case "save-url": S.clips.push({ url: d.url, site: d.url.replace(/^https?:\/\/(www\.)?/, "").split("/")[0], mark: d.url.replace(/^https?:\/\/(www\.)?/, "")[0].toUpperCase(), k: "gray", title: [t("在取标题", "Fetching the title"), "Fetching the title"] });
      renderPage(); return say(t("收进了链接", "Saved to Links"));
    case "theirs": { const E = S.edit; E.base = E.draft = body(note); E.conflict = false; E.status = "saved"; $("src").value = E.draft; paintEditor(); paintStatus(); paintConflict(); return; }
    case "fork": {
      const E = S.edit, name = `${titleOf(note)} 2`;
      newNote(name, E.draft, note.folder);
      E.base = E.draft = body(note); E.conflict = false; E.status = "saved";
      $("src").value = E.draft; paintEditor(); paintStatus(); paintConflict();
      return say(t(`你的那份另存成《${name}》`, `Yours is saved as “${name}”`));
    }
    case "p-yes": return accept();
    case "p-no": Object.assign(S, { proposal: null, revising: false }); return renderAll();
    case "p-edit": S.revising = true; renderLine(); return $("draft").focus();
    case "p-again": S.proposal = null; return void propose("");
    case "fill": $("draft").value = d.text; renderLine(); return $("draft").focus();
    case "undo": { const undo = S.toast?.undo; S.toast = null; undo?.(); return renderAll(); }
    case "mic": return void listen();
    case "ac": return pickAc(Number(d.i));
  }
});
document.addEventListener("change", (event) => {
  if (event.target.id !== "move") return;
  const note = byId(S.open), from = note.folder;
  note.folder = event.target.value;
  renderPage();
  say(t(`挪到了 ${pick(folderOf(note.folder).name)}`, `Moved to ${pick(folderOf(note.folder).name)}`), () => { note.folder = from; });
});
document.addEventListener("input", (event) => {
  if (event.target.id === "draft") renderLine();
  else if (event.target.id === "src") onEdit();
});
document.addEventListener("selectionchange", () => { if (S.view === "edit" && document.activeElement?.id === "src") paintAc(); });
document.addEventListener("keydown", (event) => {
  if (event.isComposing) return;
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k" && S.view !== "edit") { event.preventDefault(); return $("draft").focus(); }
  if (event.key === "Escape" && S.pop) { S.pop = null; return renderPop(); }
  if (S.view !== "edit") return;
  const menu = S.ac;
  if (event.target.id === "src" && menu) {
    if (event.key === "Escape") { event.preventDefault(); S.ac = null; $("ac").hidden = true; return; }
    if (menu.items.length && (event.key === "ArrowDown" || event.key === "ArrowUp")) {
      event.preventDefault();
      menu.index = (menu.index + (event.key === "ArrowDown" ? 1 : menu.items.length - 1)) % menu.items.length;
      return paintAc();
    }
    if (menu.items.length && (event.key === "Enter" || event.key === "Tab")) { event.preventDefault(); return pickAc(menu.index); }
  }
  if (event.key === "Escape") finishEdit();
});
$("lineform").addEventListener("submit", (event) => {
  event.preventDefault();
  const text = $("draft").value;
  if (!text.trim() || S.thinking) return;
  if (S.view === "read") void propose(text); else capture(text);
});

if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.scheme = "dark";
seed();
renderAll();
</script>
</body>
